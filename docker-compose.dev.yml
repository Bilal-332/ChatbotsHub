version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    container_name: chatbotshub-api-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:-mongodb://localhost:27017/chatbotshub}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_at_least_32_chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_at_least_32_chars}
      GROQ_API_KEY: ${GROQ_API_KEY}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY}
      QDRANT_URL: http://qdrant:6333
      FRONTEND_URL: http://localhost:3000
    ports:
      - '5000:5000'
    depends_on:
      - qdrant
    volumes:
      - ./backend/src:/app/src
      - ./backend/tmp:/app/tmp
    command: npm run dev
    networks:
      - chatbotshub-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: chatbotshub-qdrant-dev
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant-dev-data:/qdrant/storage
    networks:
      - chatbotshub-net

volumes:
  qdrant-dev-data:

networks:
  chatbotshub-net:
    driver: bridge
